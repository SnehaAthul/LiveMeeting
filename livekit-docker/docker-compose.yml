services:
  redis:
    image: redis:7-alpine
    container_name: lk-redis
    network_mode: host
    restart: unless-stopped
    command: redis-server --bind 127.0.0.1 --port 6379

  livekit:
    image: livekit/livekit-server:v1.9.4
    container_name: lk-server
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./livekit.yaml:/livekit.yaml
    command: --config /livekit.yaml
    depends_on:
      - redis

  egress:
    image: livekit/egress:v1.11
    container_name: lk-egress
    network_mode: host
    restart: unless-stopped
    environment:
      - EGRESS_CONFIG_FILE=/egress.yaml
      - CHROME_DEVEL_SANDBOX=/usr/local/sbin/chrome-devel-sandbox
    volumes:
      - ./egress.yaml:/egress.yaml
      - ./recordings:/out
    shm_size: 2gb
    depends_on:
      - livekit
    extra_hosts:
      - "host.docker.internal:host-gateway"